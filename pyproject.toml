[project]
name = "dexjoco"
version = "0.2.0"
description = "DexJoCo simulation environments for LeRobot EnvHub"
readme = "README.md"
authors = [
    { name = "Weizhi Zhao", email = "zhaoweizhi2025@ia.ac.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "dm-robotics-transformations>=0.10.0",
    "gymnasium>=1.3.0",
    "mujoco==3.4.0",
    "numpy>=2.0.0,<2.3.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
    "tyro>=1.0.16",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lerobot>=0.6.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
# Third-party packages are not checked; mujoco ships no type stubs.
ignore_missing_imports = true

[tool.ruff]
# Only lint the package sources, so `uv run ruff check` needs no path argument.
include = ["src/**/*.py", "pyproject.toml"]
